[package]
name = "claude-commander"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A high-performance terminal UI for managing Claude coding sessions"
keywords = ["claude", "ai", "terminal", "tui", "tmux"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "claude-commander"
path = "src/main.rs"

[dependencies]
# `audio` is forwarded rather than inherited from core's defaults so the binary
# can be built without it (`--no-default-features`): the published `-novoice`
# archive, which does not link libasound/libpipewire. See the TUI's manifest.
claude-commander-core = { path = "../claude-commander-core", default-features = false, features = [
    "clipboard",
] }
# The ratatui frontend (`App`, and the Alt+Tab `picker` popup). Lives outside
# core so consumers that render nothing — the server, the remote client, the
# Flutter cdylib — don't compile a terminal UI.
claude-commander-tui = { path = "../claude-commander-tui", default-features = false }
# HTTP client backend for remote servers. The binary owns this dependency (core
# does not) and injects a factory closure into the TUI, so the dependency
# direction stays bin → {core, tui, remote}.
claude-commander-remote = { path = "../claude-commander-remote" }
# The HTTP server, run in-process by `--serve` / `[server] auto_start`. Only this
# binary depends on both it and the TUI: the terminal frontend must not compile
# axum, and the server must not compile ratatui. See `src/serve.rs`.
claude-commander-server = { path = "../claude-commander-server" }

# Async runtime (the `#[tokio::main]` entry point)
tokio = { workspace = true }

# CLI (derive macros - idiomatic Rust)
clap = { version = "4.6", features = ["derive"] }

# Serialization (JSON + TOML output for the CLI subcommands)
serde_json = { workspace = true }
toml = "1.1"

# Unix system calls — raise the file-descriptor rlimit at startup
nix = { version = "0.31", features = ["resource"] }

# Error handling
color-eyre = "0.6"

# Observability
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["audio"]
audio = ["claude-commander-core/audio", "claude-commander-tui/audio"]

[dev-dependencies]
# Hermetic temp dirs for the `serve` module tests (they write a config.toml).
tempfile = "3.27"
